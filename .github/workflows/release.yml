# Builds and publishes the three images that make up a TicketLens release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every image is pushed under the same three tags — the version, the commit, and
# latest — so a deployment sets IMAGE_TAG once and all three services move as a
# set. Mixing tags across services is the failure this naming is meant to make
# obvious.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs exist for re-publishing a tag whose build failed for an
  # infrastructure reason, without minting a new version number.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve names
        id: meta
        run: |
          # GHCR rejects uppercase in a repository path; the owner here is
          # mixed case, so normalise rather than hardcode it.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "registry=ghcr.io/${owner}"
            echo "version=${version}"
            echo "commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ────────────────────────────────────────────────────────────
      # Version and commit are stamped into both binaries via ldflags, so a
      # running container can report which release it is rather than the build
      # default.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/deployments/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          tags: |
            ${{ steps.meta.outputs.registry }}/ticketlens-backend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.registry }}/ticketlens-backend:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.registry }}/ticketlens-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/ticketlens-frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.registry }}/ticketlens-frontend:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.registry }}/ticketlens-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ── Classifier ─────────────────────────────────────────────────────────
      # The trained checkpoint is not in git (it is large and binary), so it is
      # fetched here and baked into the image. Without MODEL_ARTIFACT_URL the
      # build still succeeds and the service falls back to the keyword stub —
      # fine for a test tag, not something to ship to a customer. The step below
      # makes which one happened visible in the job summary rather than leaving
      # it to be discovered from /healthz in production.
      - name: Fetch model checkpoint
        id: model
        env:
          MODEL_ARTIFACT_URL: ${{ vars.MODEL_ARTIFACT_URL }}
          MODEL_ARTIFACT_TOKEN: ${{ secrets.MODEL_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backend/ml/models

          if [ -z "${MODEL_ARTIFACT_URL}" ]; then
            echo "model_version=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=No model checkpoint::MODEL_ARTIFACT_URL is not set. The classifier image will serve the keyword stub, not the trained model."
            echo '⚠️ **Classifier: keyword stub** — no `MODEL_ARTIFACT_URL` configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          auth=()
          if [ -n "${MODEL_ARTIFACT_TOKEN}" ]; then
            auth=(--header "Authorization: Bearer ${MODEL_ARTIFACT_TOKEN}")
          fi

          curl --fail --location --silent --show-error "${auth[@]}" \
            "${MODEL_ARTIFACT_URL}" --output /tmp/model.tar.gz
          tar -xzf /tmp/model.tar.gz -C backend/ml/models --strip-components=0

          # TorchBackend loads a checkpoint only when model.pt is present
          # (serve.py load_backend). Anything else means the archive was not
          # what this expects, and shipping it would silently serve the stub.
          if [ ! -f backend/ml/models/model.pt ]; then
            echo "::error title=Bad model artifact::The archive contains no model.pt at backend/ml/models/"
            find backend/ml/models -maxdepth 2 -type f | head -20
            exit 1
          fi

          version="$(python3 -c "import json,pathlib;p=pathlib.Path('backend/ml/models/meta.json');print(json.loads(p.read_text()).get('config',{}).get('model_name','unknown') if p.exists() else 'unknown')")"
          echo "model_version=${version}" >> "$GITHUB_OUTPUT"
          echo "✅ **Classifier: trained model** (\`${version}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push classifier
        uses: docker/build-push-action@v6
        with:
          context: backend/ml
          file: backend/ml/Dockerfile
          push: true
          build-args: |
            MODEL_VERSION=${{ steps.model.outputs.model_version }}
          tags: |
            ${{ steps.meta.outputs.registry }}/ticketlens-classifier:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.registry }}/ticketlens-classifier:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.registry }}/ticketlens-classifier:latest
          cache-from: type=gha,scope=classifier
          cache-to: type=gha,scope=classifier,mode=max

      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.meta.outputs.version }}"
            echo ""
            echo "Deploy with \`IMAGE_TAG=${{ steps.meta.outputs.version }}\` in \`deployments/.env.prod\`."
            echo ""
            echo "- \`${{ steps.meta.outputs.registry }}/ticketlens-backend\`"
            echo "- \`${{ steps.meta.outputs.registry }}/ticketlens-frontend\`"
            echo "- \`${{ steps.meta.outputs.registry }}/ticketlens-classifier\`"
          } >> "$GITHUB_STEP_SUMMARY"
