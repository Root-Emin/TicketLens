# Runs on every push and pull request. Nothing here publishes anything — see
# release.yml for that.
#
# Three independent jobs rather than one: a Go test failure and a frontend type
# error are different people's problems, and running them in parallel keeps the
# feedback under the time where anybody starts ignoring it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when the branch is pushed again. main is excluded
  # by keying on the ref, so its history is never left with unverified commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      # -race matters here: the gateway pipeline, the websocket hub and the
      # in-process event bus are all concurrent, and a data race in any of them
      # would otherwise only show up under a customer's load.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      # v6 of this action drives golangci-lint v1 and passes it flags v2 does not
      # accept, which is how `version: latest` failed with exit 3 rather than
      # with a lint finding. v9 speaks v2.
      #
      # goinstall rather than the default prebuilt binary: this module is on Go
      # 1.26, and a release binary compiled against an older toolchain cannot
      # always read its package data. Building golangci-lint with the same Go the
      # rest of this job uses removes that as a source of failure.
      #
      # The version is pinned, not `latest`, so a golangci-lint release cannot
      # fail main on a commit that did not change any Go. Bump it together with
      # backend/.golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: backend

      # The image build compiles both binaries; nothing else in this job would
      # catch a Dockerfile that no longer builds. No push — that is release.yml.
      - name: Build backend image
        run: docker build -f deployments/Dockerfile -t ticketlens-backend:ci .

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build type-checks the whole app, so this is the type check too.
      # NODE_ENV=production also compiles out the development-only auth bypass
      # in src/lib/server/dev-session.ts, which is the configuration that ships.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"

  ml:
    name: Classifier (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The base install plus dev tooling. torch is not installed here: the
      # tests exercise the taxonomy, the data pipeline and the stub backend, and
      # pulling ~2 GB of wheels to run them would dominate the job.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q
